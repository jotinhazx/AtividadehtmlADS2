<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Responsivo com Grid</title>
  <link rel="stylesheet" href="estilo.css ">
</head>
<body>
  <!-- Versão Desktop -->
  <div class="desktop-only">
    <div class="container-desktop">
      <header class="logo">Logo</header>
      <nav class="sidebar">Side bar de Navegação</nav>
      <div class="banner">Banner / Header</div>
      <main class="body-area">
        <main>Body Area</main>
      </main>
      <footer>Footer</footer>
    </div>
  </div>

  <!-- Versão Mobile -->
  <div class="mobile-only">
    <header class="logo">Logo</header>
    <nav class="nav-mobile">
      Navegação
    </nav>
    <main>
      <section class="grid-imagens">
          <!-- 16 Imagens para o layout mobile -->
          <img src="img/fla.jpeg" alt="Imagem 1">
        <img src="img/fla.jpeg" alt="Imagem 2">
        <img src="img/fla.jpeg" alt="Imagem 3">
        <img src="img/fla.jpeg" alt="Imagem 4">
        <img src="img/fla.jpeg" alt="Imagem 5">
        <img src="img/fla.jpeg" alt="Imagem 6">
        <img src="img/fla.jpeg" alt="Imagem 7">
        <img src="img/fla.jpeg" alt="Imagem 8">
        <img src="img/fla.jpeg" alt="Imagem 9">
        <img src="img/fla.jpeg" alt="Imagem 10">
        <img src="img/fla.jpeg" alt="Imagem 11">
        <img src="img/fla.jpeg" alt="Imagem 12">
        <img src="img/fla.jpeg" alt="Imagem 13">
        <img src="img/fla.jpeg" alt="Imagem 14">
        <img src="img/fla.jpeg" alt="Imagem 15">
        <img src="img/fla.jpeg" alt="Imagem 16">
      </section>
      <section class="box-area">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
      </section>
    </main>
    <footer>Footer</footer>
  </div>
</body>
</html>
